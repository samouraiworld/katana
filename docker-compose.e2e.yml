# End-to-end stack: gnomonitoring + katana against the local devnet.
#
# The devnet itself is NOT part of this file — it is built and run separately
# (gnoland-test/ bootstrap.sh + docker compose up), which creates the external
# network `gnoland-test_default` that the services below join.
#
# Usage — real gnomonitoring (broadcast non-regression):
#   1. cd gnoland-test && GNO_REPO_PATH=/path/to/gno ./bootstrap.sh && make full-reinit-4
#   2. make scenario2   # stop validator4 -> real degradation
#   3. docker compose -f docker-compose.e2e.yml up --build
#
# Usage — stub gnomonitoring (katana logic: eject/lower_vp/raise_vp/dry_run),
# no postgres/gnomonitoring needed, scores come from gnoland-test/stub-gnomonitoring
# running on the host:
#   1. cd gnoland-test && make full-reinit-4 && make stub-scenario NAME=eject && make stub-up
#   2. cp deploy/e2e/katana.config.stub.yaml.example deploy/e2e/katana.config.yaml
#   3. docker compose -f docker-compose.e2e.yml up --build --no-deps katana
#
# See deploy/e2e/README.md for the full walkthrough.

services:
  postgres:
    image: postgres:16
    container_name: katana-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnomonitoring
      POSTGRES_PASSWORD: gnomonitoring
      POSTGRES_DB: gnomonitoring
    volumes:
      - e2e-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnomonitoring -d gnomonitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  gnomonitoring:
    image: ghcr.io/samouraiworld/gnomonitoring-server:latest
    container_name: katana-e2e-gnomonitoring
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/e2e/gnomonitoring.config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8989:8989"   # REST API (handy for debugging)
    # The published image runs the server by default; uncomment if it needs an
    # explicit command (their compose used ["./server"]).
    # command: ["./server"]
    networks:
      - default
      - gno-devnet

  katana:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must match the gno commit the gnoland-test devnet was built from. Defaults
        # to the chain/mainnet tag commit (see Dockerfile); override with GNO_REF.
        GNO_REF: ${GNO_REF:-9c8eb132e483d6fd324d92c193e629ad65a98a37}
    image: katana:latest
    container_name: katana-e2e
    restart: unless-stopped
    depends_on:
      - gnomonitoring
    # Both e2e config examples set notifications.discord.enabled: true with an
    # empty webhook_url ("via env KATANA_DISCORD_WEBHOOK") — export it in the
    # shell before `make launch-test-katana` / `docker compose up` to actually
    # receive notifications; defaults to empty (no-op, matches notify's
    # best-effort semantics) if unset.
    environment:
      KATANA_DISCORD_WEBHOOK: ${KATANA_DISCORD_WEBHOOK:-}
    volumes:
      - ./deploy/e2e/katana.config.yaml:/app/config.yaml:ro
      - e2e-katana-data:/app/data
    ports:
      - "127.0.0.1:8990:8990"   # /health
    command: ["--config", "/app/config.yaml"]
    networks:
      - default
      - gno-devnet
    # Lets the container reach a stub-gnomonitoring server running on the host
    # (gnoland-test/stub-gnomonitoring, started with 'make stub-up') via
    # http://host.docker.internal:8989 — see katana.config.stub.yaml.example.
    # Only relevant when run with --no-deps (skips gnomonitoring/postgres).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  e2e-pgdata:
  e2e-katana-data:

networks:
  default:
  # The devnet network, created by `cd gnoland-test && docker compose up -d`.
  # Start the devnet FIRST or this external network won't exist.
  gno-devnet:
    name: gnoland-test_default
    external: true
