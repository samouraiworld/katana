# gnomonitoring config for the e2e stack (docker-compose.e2e.yml).
#
# Mounted into the gnomonitoring-server container at /app/config.yaml. It points
# gnomonitoring at the local devnet (gnoland-test/) as chain "local", addressing
# the devnet services by their compose service names over the shared external
# network `gnoland-test_default`.

backend_port: "8989"
metrics_port: 8888
dev_mode: true
allow_origin: "http://localhost:3000"

# Clerk is only needed for the admin-protected endpoints (e.g. /admin/alerts).
# The e2e katana config uses only the public /missing_block endpoint, so a
# placeholder is fine here. Replace to exercise the critical_alerts path.
clerk_secret_key: "sk_test_placeholder_change_me"

token_telegram_validator: ""
token_telegram_govdao: ""

database:
  host: "postgres"          # compose service name
  port: 5432
  user: "gnomonitoring"
  password: "gnomonitoring" # must match POSTGRES_PASSWORD in the compose
  dbname: "gnomonitoring"
  sslmode: "disable"

default_chain: "local"
chains:
  local:
    rpc_endpoints:
      - "http://validator:26657"              # devnet service (internal port)
    graphqls:
      - "http://tx-indexer:8546/graphql/query"
    gnowebs:
      - "http://gnoweb:8888"
    enabled: true
